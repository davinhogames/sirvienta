import groovy.json.JsonOutput

plugins {
    id "com.android.application"
}

def updateManifestUrl = providers.gradleProperty("sirvientaUpdateManifestUrl").getOrElse("")
def appVersionCode = providers.gradleProperty("sirvientaVersionCode").map { it.toInteger() }.getOrElse(13)
def appVersionName = providers.gradleProperty("sirvientaVersionName").getOrElse("1.1-beta")
def signingKeystorePath = providers.environmentVariable("SIRVIENTA_KEYSTORE_PATH").orNull
def signingStorePassword = providers.environmentVariable("SIRVIENTA_KEYSTORE_PASSWORD").orNull
def signingKeyAlias = providers.environmentVariable("SIRVIENTA_KEY_ALIAS").orNull
def signingKeyPassword = providers.environmentVariable("SIRVIENTA_KEY_PASSWORD").orNull
def hasReleaseSigning = [signingKeystorePath, signingStorePassword, signingKeyAlias, signingKeyPassword]
    .every { it != null && !it.isEmpty() }

android {
    namespace "com.sirvienta.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.sirvienta.android"
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${updateManifestUrl.replace("\"", "\\\"")}\""
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingKeystorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    ndkVersion "29.0.13113456"

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.31.6"
        }
    }

    androidResources {
        noCompress += ["gguf", "onnx"]
    }

    sourceSets {
        main {
            assets.srcDir(file("../../data"))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}

tasks.register("writeDebugReleaseMetadata") {
    outputs.upToDateWhen { false }
    doLast {
        def apk = file("$buildDir/outputs/apk/debug/app-debug.apk")
        def metadata = new File(apk.parentFile, "release.json")
        metadata.text = JsonOutput.toJson([
            version_code: android.defaultConfig.versionCode,
            version_name: android.defaultConfig.versionName,
            apk_last_modified: apk.lastModified(),
        ])
    }
}

tasks.matching { it.name == "assembleDebug" }.configureEach {
    finalizedBy("writeDebugReleaseMetadata")
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "com.alphacephei:vosk-android:0.3.47"
    implementation files("libs/sherpa-onnx-1.13.8.aar")
}
